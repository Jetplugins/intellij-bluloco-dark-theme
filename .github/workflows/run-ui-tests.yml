name: Run UI Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build.gradle.kts"
      - "gradle/**"
      - "src/main/resources/themes/**"
      - "src/main/theme/**"
      - "src/uiTest/**"
      - "scripts/create-screenshots.sh"
      - ".github/workflows/run-ui-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  robot-theme-assertions:
    name: Robot theme assertions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Start Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export DISPLAY=:99.0
          echo "DISPLAY=${DISPLAY}" >> "$GITHUB_ENV"
          Xvfb -ac :99 -screen 0 1920x1080x24 > build-xvfb.log 2>&1 &

      - name: Start IntelliJ with Robot server
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew runIdeForUiTests > build-ui-test-ide.log 2>&1 &

      - name: Start IntelliJ with Robot server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath ".\gradlew.bat" `
            -ArgumentList "runIdeForUiTests" `
            -RedirectStandardOutput "build-ui-test-ide.log" `
            -RedirectStandardError "build-ui-test-ide-error.log"

      - name: Wait for Robot server
        uses: jtalk/url-health-check-action@v5
        with:
          url: http://127.0.0.1:8082
          max-attempts: 30
          retry-delay: 10s

      - name: Assert themes and capture screenshots
        run: ./gradlew uiScreenshotTest -PcloseIde=true

      - name: Upload Robot screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-theme-screenshots-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build/ui-test/screenshots
            build/reports/tests/uiScreenshotTest
            build-ui-test-ide*.log
            build-xvfb.log
