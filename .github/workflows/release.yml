name: Publish to JetBrains Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marketplace-${{ github.event.release.tag_name || inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}

    steps:
      - name: Fetch released sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_version }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true

      - name: Validate release version and publishing token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          PLUGIN_VERSION=$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)
          test "$RELEASE_VERSION" = "$PLUGIN_VERSION"
          test -n "$PUBLISH_TOKEN"

      - name: Patch changelog
        if: github.event_name == 'release' && github.event.release.body != ''
        env:
          CHANGELOG: ${{ github.event.release.body }}
        shell: bash
        run: |
          RELEASE_NOTE=build/tmp/release-note.md
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          printf '%s\n' "$CHANGELOG" \
            | sed '/<!-- automated-plugin-draft -->/d' \
            > "$RELEASE_NOTE"

          ./gradlew patchChangelog --release-note-file="$RELEASE_NOTE"

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload plugin to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" build/distributions/*.zip --clobber

      - name: Propose changelog update
        if: github.event_name == 'release' && github.event.release.body != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="changelog-update-$RELEASE_VERSION"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git switch -c "$BRANCH"
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already current"
            exit 0
          fi

          git commit -m "Update changelog for $RELEASE_VERSION"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update changelog for $RELEASE_VERSION" \
            --body "Moves the published release notes from \`Unreleased\` into the \`$RELEASE_VERSION\` section of \`CHANGELOG.md\`."
