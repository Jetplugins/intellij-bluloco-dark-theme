name: Publish to JetBrains Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: marketplace-${{ github.event.release.tag_name || inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}

    steps:
      - name: Fetch released sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_version }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true

      - name: Validate release version and publishing token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          PLUGIN_VERSION=$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)
          test "$RELEASE_VERSION" = "$PLUGIN_VERSION"
          test -n "$PUBLISH_TOKEN"

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload signed plugin to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" build/distributions/*.zip --clobber
