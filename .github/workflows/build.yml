name: Build
on:
  # Build every branch push before preparing its draft release.
  push:
    branches: ["**"]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Store the distribution for the draft release job.
      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error

  # Run resource and unit tests
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

  # A draft is created only after both Build and Test complete successfully.
  release-draft:
    name: Draft release
    if: github.event_name == 'push'
    needs: [ build, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Fetch sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true

      - name: Download plugin distribution
        uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: build/distributions

      - name: Create latest draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)
          test -n "$VERSION"

          mkdir -p build/tmp
          ./gradlew getChangelog \
            --unreleased \
            --no-header \
            --no-links \
            --no-empty-sections \
            --quiet \
            --console=plain \
            --output-file=build/tmp/changelog.md

          printf '<!-- automated-plugin-draft -->\n\n' > build/tmp/release-note.md
          sed -n '1,$p' build/tmp/changelog.md >> build/tmp/release-note.md

          gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100' \
            --jq '.[] | select(.draft == true and ((.body // "") | contains("<!-- automated-plugin-draft -->"))) | .id' \
            | xargs -r -I '{}' gh api -X DELETE 'repos/{owner}/{repo}/releases/{}'

          gh release create "$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file build/tmp/release-note.md \
            build/distributions/*.zip
